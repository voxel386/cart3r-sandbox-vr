
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CART3R Sandbox VR</title>
<style>
body{margin:0;overflow:hidden;background:#101827;font-family:Arial}
#info{position:fixed;top:12px;left:12px;color:white;background:#17243ddd;padding:12px;border-radius:10px;z-index:2}
</style>
</head>
<body>
<div id="info">CART3R: SANDBOX VR<br>Enter VR to play<br>Trigger: spawn objects<br>Grip: grab objects</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b9df);
scene.fog=new THREE.Fog(0x87b9df,15,60);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.6,4);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xffffff,0x536078,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
sun.castShadow=true;
scene.add(sun);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x536b48})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(100,100,0x344b35,0x71836a);
grid.position.y=.01;
scene.add(grid);

const objects=[];
const material=new THREE.MeshStandardMaterial({color:0xff9b35,roughness:.65});

function spawn(pos){
const mesh=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),material.clone());
mesh.position.copy(pos);
mesh.position.y=Math.max(.3,mesh.position.y);
mesh.castShadow=true;
mesh.userData.velocity=new THREE.Vector3();
scene.add(mesh);
objects.push(mesh);
return mesh;
}

for(let x=-3;x<=3;x+=1.5){
const box=spawn(new THREE.Vector3(x,.4,-4));
box.scale.set(1,1,1);
}

const groundMark=new THREE.Mesh(
new THREE.CylinderGeometry(1.2,1.2,.05,32),
new THREE.MeshStandardMaterial({color:0x3a536e})
);
groundMark.position.set(0,.03,-3);
scene.add(groundMark);

const controllers=[];
const raycaster=new THREE.Raycaster();
const tempMatrix=new THREE.Matrix4();

function makeController(i){
const controller=renderer.xr.getController(i);
scene.add(controller);
const line=new THREE.Line(
new THREE.BufferGeometry().setFromPoints([
new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-5)
]),
new THREE.LineBasicMaterial({color:0xffffff})
);
controller.add(line);
controller.userData.held=null;
controller.addEventListener('selectstart',()=>{
tempMatrix.identity().extractRotation(controller.matrixWorld);
raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
const hits=raycaster.intersectObjects(objects,false);
if(hits.length){
controller.userData.held=hits[0].object;
controller.attach(controller.userData.held);
}else{
const p=new THREE.Vector3(0,0,-2).applyMatrix4(controller.matrixWorld);
spawn(p);
}
});
controller.addEventListener('selectend',()=>{
const held=controller.userData.held;
if(held){
scene.attach(held);
held.userData.velocity.set(0,0,-2).applyMatrix4(controller.matrixWorld).sub(
new THREE.Vector3().setFromMatrixPosition(controller.matrixWorld)
);
controller.userData.held=null;
}
});
controllers.push(controller);
}
makeController(0);
makeController(1);

function animate(){
const dt=Math.min(renderer.clock?.getDelta?.()||.016,.04);
for(const obj of objects){
if(obj.parent===scene){
obj.position.addScaledVector(obj.userData.velocity,dt);
obj.userData.velocity.y-=9.8*dt;
if(obj.position.y<.2){
obj.position.y=.2;
obj.userData.velocity.y=Math.abs(obj.userData.velocity.y)*.35;
}
obj.userData.velocity.multiplyScalar(.99);
}
}
renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
