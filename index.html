<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090909"><title>CART3R: SANDBOX VR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font:15px system-ui,Arial;overflow:hidden}canvas{display:block}.hud{position:fixed;z-index:5;inset:12px 12px auto;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand,.panel{background:#090909eF;border:1px solid #8f1b2b;border-radius:13px;box-shadow:0 0 18px #b0002630;padding:10px 12px;pointer-events:auto}.brand b{color:#ff4059;letter-spacing:1px}.brand small{display:block;color:#aaa;font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:65%}button{background:#190a0e;color:#fff;border:1px solid #b3263d;border-radius:9px;padding:9px 11px;font-weight:650}button:active{background:#7d1429}button.primary{background:#a51631}.panel{position:fixed;z-index:6;left:12px;bottom:12px;width:min(310px,calc(100vw - 24px));max-height:48vh;overflow:auto}.panel h3{margin:0 0 8px;color:#ff4059}.panel p{color:#bbb;font-size:12px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.status{position:fixed;z-index:4;right:12px;bottom:12px;background:#090909d9;border:1px solid #54202a;border-radius:9px;padding:8px 10px;color:#bbb;font-size:11px}.crosshair{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid #ff5368;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.hint{color:#aaa;font-size:11px}@media(max-width:600px){.actions button{font-size:11px;padding:8px}.brand{font-size:12px}.panel{max-height:42vh}}
</style>
</head>
<body>
<div class="hud"><div class="brand"><b>CART3R: SANDBOX VR</b><small>PROTOTYPE 0.1 · QUEST WEBXR</small></div><div class="actions"><button id="vr" class="primary">ENTER VR</button><button id="spawnNpc">+ NPC</button><button id="spawnProp">+ PROP</button><button id="spawnBot">+ BLASTER</button></div></div>
<div class="crosshair"></div>
<div class="panel"><h3>SPAWN MENU</h3><div class="grid"><button data-spawn="npc">Spawn NPC</button><button data-spawn="crate">Wood crate</button><button data-spawn="barrel">Barrel</button><button data-spawn="ball">Physics ball</button><button data-spawn="blaster">Toy blaster</button><button id="clear">Clear spawned</button></div><p>Desktop/mobile preview: drag to look, use W/A/S/D to move. On Quest, enter VR and use the headset browser's WebXR support. This prototype uses simple placeholder geometry.</p><div class="hint" id="message">Ready. Spawn something into the sandbox.</div></div>
<div class="status" id="status">MODE: FLAT PREVIEW</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);scene.fog=new THREE.Fog(0x10131a,18,65);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9d6ff,0x28202a,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,10,6);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x343943,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(100,100,0x8e2639,0x4a3039);grid.position.y=.012;scene.add(grid);
// Simple perimeter structures create a readable sandbox test arena.
for(let i=0;i<4;i++){const wall=new THREE.Mesh(new THREE.BoxGeometry(i%2?48:.35,4,i%2?.35:48),new THREE.MeshStandardMaterial({color:0x252a35}));wall.position.set(i===1?24:i===3?-24:0,2,i===0?-24:i===2?24:0);scene.add(wall)}
const spawned=[];const mat=(c,rough=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
function addMesh(geo,material,pos){const m=new THREE.Mesh(geo,material);m.position.copy(pos);m.castShadow=true;m.receiveShadow=true;scene.add(m);spawned.push(m);return m}
function spawn(kind){const p=new THREE.Vector3(camera.position.x,0,camera.position.z-3).add(new THREE.Vector3(0,0,0));const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);p.copy(camera.position).addScaledVector(forward,3);p.y=0;
 if(kind==='npc'){const group=new THREE.Group();group.position.copy(p);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.8,4,8),mat(0x3c9b72));body.position.y=1;body.castShadow=true;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),mat(0xf0bd91));head.position.y=1.7;head.castShadow=true;group.add(head);const eyeMat=mat(0x171717);for(const x of [-.08,.08]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),eyeMat);eye.position.set(x,1.73,-.2);group.add(eye)}scene.add(group);spawned.push(group);group.userData.kind='npc';group.userData.phase=Math.random()*6;}
 else if(kind==='crate'){addMesh(new THREE.BoxGeometry(.9,.9,.9),mat(0x9a6538),p.clone().setY(.45));}
 else if(kind==='barrel'){addMesh(new THREE.CylinderGeometry(.38,.38,1.05,16),mat(0x9a3038),p.clone().setY(.525));}
 else if(kind==='ball'){const b=addMesh(new THREE.SphereGeometry(.32,20,16),mat(0x3e8cff,.35),p.clone().setY(1.1));b.userData.velocity=new THREE.Vector3(forward.x*4,3,forward.z*4);}
 else if(kind==='blaster'){const g=new THREE.Group();g.position.copy(p).setY(1.1);const grip=new THREE.Mesh(new THREE.BoxGeometry(.18,.42,.22),mat(0x282a32));grip.position.y=-.16;g.add(grip);const barrel=new THREE.Mesh(new THREE.BoxGeometry(.22,.2,.75),mat(0x9e263c,.4));barrel.position.z=-.35;g.add(barrel);const glow=new THREE.Mesh(new THREE.BoxGeometry(.12,.07,.15),mat(0xff4059,.25));glow.position.set(0,.1,-.25);g.add(glow);scene.add(g);spawned.push(g);g.userData.kind='blaster';}
 document.getElementById('message').textContent='Spawned: '+kind.toUpperCase();}
document.querySelectorAll('[data-spawn]').forEach(b=>b.addEventListener('click',()=>spawn(b.dataset.spawn)));document.getElementById('spawnNpc').onclick=()=>spawn('npc');document.getElementById('spawnProp').onclick=()=>spawn('crate');document.getElementById('spawnBot').onclick=()=>spawn('blaster');document.getElementById('clear').onclick=()=>{for(const o of spawned)scene.remove(o);spawned.length=0;document.getElementById('message').textContent='Spawned objects cleared.'};
document.getElementById('vr').onclick=async()=>{try{if(!navigator.xr)throw new Error('WebXR is unavailable in this browser. Open this HTTPS page in Meta Quest Browser.');const ok=await navigator.xr.isSessionSupported('immersive-vr');if(!ok)throw new Error('Immersive VR is not supported here.');const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});await renderer.xr.setSession(session);document.getElementById('status').textContent='MODE: IMMERSIVE VR';session.addEventListener('end',()=>document.getElementById('status').textContent='MODE: FLAT PREVIEW');}catch(e){document.getElementById('message').textContent=e.message;}};
let yaw=0,pitch=0,keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging||renderer.xr.isPresenting)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch));lastX=e.clientX;lastY=e.clientY;camera.rotation.set(pitch,yaw,0,'YXZ')});
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.04);if(!renderer.xr.isPresenting){const dir=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,dt*4);camera.position.y=1.7;}for(const o of spawned){if(o.userData.kind==='npc'){o.userData.phase+=dt;o.position.x+=Math.sin(o.userData.phase*.7)*dt*.25;}if(o.userData.velocity){o.userData.velocity.y-=9.8*dt;o.position.addScaledVector(o.userData.velocity,dt);if(o.position.y<.32){o.position.y=.32;o.userData.velocity.y*=-.55;o.userData.velocity.multiplyScalar(.82);}}}renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
